{% extends "base.html" %}
{% block content %}
<h2 style="color:#e91e63;margin-bottom:15px">👥 مدیریت کارمندان</h2>

<div id="modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;padding:25px;width:400px;max-width:90vw">
    <h3 id="modal_title" style="color:#e91e63;margin-bottom:15px">افزودن کارمند</h3>
    <form method="POST">
      <input type="hidden" name="action" id="f_action" value="add">
      <input type="hidden" name="idx" id="f_idx" value="">
      <div style="margin-bottom:10px"><label>نام *</label><input name="name" id="f_name" required></div>
      <div style="margin-bottom:10px"><label>تخصص</label>
        <select name="specialty" id="f_specialty"><option value="">---</option><option>مو</option><option>ناخن</option><option>ابرو</option><option>مژه</option><option>صورت</option></select>
      </div>
      <div style="margin-bottom:10px"><label>تلفن</label><input name="phone" id="f_phone"></div>
      <div style="margin-bottom:15px"><label>درصد سهم (پورسانت)</label><input type="number" name="share" id="f_share" value="0" min="0" max="100"></div>
      <div style="display:flex;gap:8px"><button type="submit" class="btn btn-success">ذخیره</button><button type="button" class="btn btn-secondary" onclick="closeModal()">لغو</button></div>
    </form>
  </div>
</div>

<div class="card">
  <table>
    <thead><tr><th>نام</th><th>تخصص</th><th>تلفن</th><th>درصد سهم</th><th>عملیات</th></tr></thead>
    <tbody>
    {% for e in employees %}
    <tr>
      <td>{{ e.name }}</td><td>{{ e.specialty }}</td><td>{{ e.phone }}</td><td>{{ e.share_percent }}%</td>
      <td>
        <button class="btn btn-secondary" style="padding:3px 8px;font-size:11px" onclick="editEmp({{ loop.index0 }},'{{ e.name }}','{{ e.specialty }}','{{ e.phone }}',{{ e.share_percent }})">✏️</button>
        <form method="POST" style="display:inline" onsubmit="return confirm('حذف {{ e.name }}؟')">
          <input type="hidden" name="action" value="delete"><input type="hidden" name="idx" value="{{ loop.index0 }}">
          <button class="btn btn-danger" style="padding:3px 8px;font-size:11px">❌</button>
        </form>
      </td>
    </tr>
    {% endfor %}
    </tbody>
  </table>
  {% if not employees %}<div class="empty">کارمندی ثبت نشده</div>{% endif %}
</div>

<button class="btn btn-primary" style="position:fixed;bottom:20px;left:20px;font-size:15px;padding:12px 20px;border-radius:50px" onclick="openAdd()">➕ افزودن کارمند</button>

<script>
function openAdd(){
  document.getElementById('f_action').value='add';
  document.getElementById('modal_title').textContent='افزودن کارمند';
  document.getElementById('f_name').value='';document.getElementById('f_specialty').value='';
  document.getElementById('f_phone').value='';document.getElementById('f_share').value='0';
  document.getElementById('f_idx').value='';
  document.getElementById('modal').style.display='flex';
}
function editEmp(i,name,spec,phone,share){
  document.getElementById('f_action').value='edit';
  document.getElementById('modal_title').textContent='ویرایش کارمند';
  document.getElementById('f_idx').value=i;
  document.getElementById('f_name').value=name;document.getElementById('f_specialty').value=spec;
  document.getElementById('f_phone').value=phone;document.getElementById('f_share').value=share;
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}
</script>
{% endblock %}
