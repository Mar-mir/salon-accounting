<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابداری سالن آرایش</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma,Tahoma,sans-serif;background:#fce4ec;color:#4a148c;min-height:100vh}
a{color:#e91e63;text-decoration:none}
a:hover{text-decoration:underline}
.nav{background:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:2px solid #f8bbd0;position:sticky;top:0;z-index:100}
.nav a{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:bold;transition:.2s}
.nav a:hover,.nav a.active{background:#e91e63;color:#fff;text-decoration:none}
.container{max-width:1100px;margin:0 auto;padding:15px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px;border:1px solid #f8bbd0}
.card h2{color:#e91e63;margin-bottom:15px;font-size:18px}
.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:15px}
.summary .box{flex:1;min-width:180px;background:#fff;border-radius:12px;padding:15px;text-align:center;border:1px solid #f8bbd0}
.summary .box .label{color:#7b1fa2;font-size:13px}
.summary .box .value{font-size:26px;font-weight:bold;color:#e91e63;margin-top:5px}
.summary .box .value.green{color:#2e7d32}
.summary .box .value.orange{color:#e65100}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
th{background:#fce4ec;color:#e91e63;padding:10px;font-size:13px;border-bottom:2px solid #f8bbd0}
td{padding:9px 10px;border-bottom:1px solid #fce4ec;font-size:13px;text-align:right}
tr:hover{background:#fce4ec}
input,select,textarea{font-family:Tahoma,sans-serif;padding:8px 12px;border:1px solid #f8bbd0;border-radius:8px;font-size:13px;background:#fce4ec;color:#4a148c;direction:rtl;text-align:right;width:100%}
input:focus,select:focus{outline:none;border-color:#e91e63;box-shadow:0 0 0 2px #f8bbd0}
.btn{display:inline-block;padding:8px 18px;border:none;border-radius:8px;font-family:Tahoma,sans-serif;font-size:13px;font-weight:bold;cursor:pointer;transition:.2s;text-decoration:none}
.btn-primary{background:#e91e63;color:#fff}.btn-primary:hover{background:#f06292}
.btn-success{background:#2e7d32;color:#fff}.btn-success:hover{background:#27ae60}
.btn-danger{background:#c62828;color:#fff}.btn-danger:hover{background:#c0392b}
.btn-secondary{background:#f8bbd0;color:#4a148c}.btn-secondary:hover{background:#f48fb1}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.form-row label{font-size:12px;color:#7b1fa2;margin-bottom:3px;display:block}
.form-row .field{flex:1;min-width:140px}
.flash{padding:10px 15px;border-radius:8px;margin-bottom:10px;font-size:13px}
.flash.success{background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9}
.flash.error{background:#ffebee;color:#c62828;border:1px solid #ffcdd2}
.flash.info{background:#e3f2fd;color:#1565c0;border:1px solid #bbdefb}
.empty{text-align:center;padding:40px;color:#7b1fa2;font-size:15px}
@media(max-width:600px){.summary .box{min-width:100%}.form-row{flex-direction:column}.nav{gap:3px}.nav a{font-size:11px;padding:6px 10px}}
</style>
</head>
<body>
<nav class="nav">
  <a href="/">💰 ثبت تراکنش</a>
  <a href="/reports">📊 گزارش امروز</a>
  <a href="/monthly">📅 گزارش ماهانه</a>
  <a href="/backup">📦 بکاپ</a>
  <a href="/customers">📒 مشتریان</a>
  <a href="/employees">👥 کارمندان</a>
  <a href="/services">🛎️ خدمات</a>
</nav>
<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  {% for cat, msg in messages %}
  <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
