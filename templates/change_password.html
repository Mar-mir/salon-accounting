{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:500px;margin:30px auto">
  <h2>🔐 تغییر رمز عبور</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
  <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% endwith %}

  <form method="POST" action="/change-password">
    <div class="form-row" style="margin-bottom:14px">
      <label style="font-weight:600;margin-bottom:6px;display:block">رمز فعلی</label>
      <input type="password" name="current_password" required
             style="width:100%;padding:12px;border:2px solid var(--pink-200);border-radius:10px;font-size:15px;font-family:inherit;direction:ltr;text-align:center;letter-spacing:4px">
    </div>

    <div class="form-row" style="margin-bottom:14px">
      <label style="font-weight:600;margin-bottom:6px;display:block">رمز جدید</label>
      <input type="password" name="new_password" required minlength="4"
             style="width:100%;padding:12px;border:2px solid var(--pink-200);border-radius:10px;font-size:15px;font-family:inherit;direction:ltr;text-align:center;letter-spacing:4px">
    </div>

    <div class="form-row" style="margin-bottom:20px">
      <label style="font-weight:600;margin-bottom:6px;display:block">تکرار رمز جدید</label>
      <input type="password" name="confirm_password" required minlength="4"
             style="width:100%;padding:12px;border:2px solid var(--pink-200);border-radius:10px;font-size:15px;font-family:inherit;direction:ltr;text-align:center;letter-spacing:4px">
    </div>

    <button type="submit" class="btn" style="width:100%;padding:14px;font-size:16px;font-weight:700">
      💾 ذخیره رمز جدید
    </button>
  </form>
</div>
{% endblock %}
