<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سالن</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
            overflow: hidden;
        }

        /* ── Floating particles ── */
        .particles {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            animation: float linear infinite;
        }
        @keyframes float {
            0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.3; }
            90%  { opacity: 0.3; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        /* ── Card ── */
        .login-card {
            position: relative; z-index: 1;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 48px 40px;
            width: 400px;
            max-width: 92vw;
            box-shadow:
                0 20px 60px rgba(233,30,99,0.15),
                0 0 0 1px rgba(255,255,255,0.6) inset;
            text-align: center;
            animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Logo / Emoji ── */
        .logo {
            font-size: 64px;
            margin-bottom: 8px;
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.08); }
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            color: #880e4f;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 14px;
            color: #ad1457;
            margin-bottom: 32px;
            opacity: 0.7;
        }

        /* ── Input group ── */
        .input-group {
            position: relative;
            margin-bottom: 24px;
        }
        .input-group input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            border: 2px solid #f48fb1;
            border-radius: 16px;
            font-family: inherit;
            font-size: 16px;
            background: rgba(252,228,236,0.5);
            color: #880e4f;
            outline: none;
            transition: all 0.3s ease;
            direction: ltr;
            text-align: center;
            letter-spacing: 6px;
        }
        .input-group input::placeholder {
            letter-spacing: 0;
            color: #c2185b;
            opacity: 0.5;
        }
        .input-group input:focus {
            border-color: #e91e63;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 0 4px rgba(233,30,99,0.12);
        }
        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .input-group input:focus ~ .input-icon {
            opacity: 1;
        }

        /* ── Eye toggle ── */
        .toggle-pw {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .toggle-pw:hover { opacity: 0.8; }

        /* ── Button ── */
        .btn-login {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #e91e63, #c2185b);
            color: #fff;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(233,30,99,0.3);
            position: relative;
            overflow: hidden;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(233,30,99,0.4);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        .btn-login:hover::after {
            transform: translateX(100%);
        }

        /* ── Error message ── */
        .error-msg {
            background: #fce4ec;
            color: #c62828;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            animation: shake 0.5s ease-in-out;
            border: 1px solid #ef9a9a;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%      { transform: translateX(-8px); }
            40%      { transform: translateX(8px); }
            60%      { transform: translateX(-5px); }
            80%      { transform: translateX(5px); }
        }

        /* ── Footer ── */
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #ad1457;
            opacity: 0.4;
        }

        /* ── Responsive ── */
        @media (max-width: 440px) {
            .login-card { padding: 36px 24px; border-radius: 20px; }
            .logo { font-size: 52px; }
            .title { font-size: 19px; }
        }
    </style>
</head>
<body>

<!-- Floating particles -->
<div class="particles" id="particles"></div>

<!-- Login Card -->
<div class="login-card">
    <div class="logo">💇‍♀️</div>
    <div class="title">حسابداری سالن آرایش</div>
    <div class="subtitle">برای ورود، رمز عبور را وارد کنید</div>

    {% if error %}
    <div class="error-msg">⚠️ رمز عبور اشتباه است</div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="input-group">
            <input
                type="password"
                name="password"
                id="password"
                placeholder="رمز عبور"
                autofocus
                autocomplete="off"
            >
            <span class="input-icon">🔐</span>
            <button type="button" class="toggle-pw" onclick="togglePw()">👁️</button>
        </div>
        <button type="submit" class="btn-login">ورود →</button>
    </form>

    <div class="footer">ساخته شده با ❤️ برای سالن‌های آرایش رشت</div>
</div>

<script>
    // Toggle password visibility
    function togglePw() {
        const inp = document.getElementById('password');
        inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    // Auto-focus
    document.getElementById('password').focus();

    // Generate floating particles
    const container = document.getElementById('particles');
    const colors = ['#e91e63', '#f48fb1', '#f06292', '#ec407a', '#d81b60'];
    for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 12 + 4;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.animationDuration = (Math.random() * 15 + 10) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        container.appendChild(p);
    }

    // Enter key submits
    document.getElementById('password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') this.closest('form').submit();
    });
</script>

</body>
</html>
